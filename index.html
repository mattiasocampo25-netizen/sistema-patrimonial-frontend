      <h1>Sistema de Gestión Patrimonial UNP - Universidad Nacional de Pilar</h1>
      <h2>Control institucional del patrimonio universitario</h2>
      <p>Plataforma institucional para el control del patrimonio de la Universidad Nacional de Pilar (UNP). Permite administrar el inventario de bienes, registrar responsables y seguir cada movimiento desde un mismo lugar.</p>
      <p>El sistema ofrece módulos de inventario, dashboard de métricas, gestión de funcionarios, actas FC-04, FC-10 y FC-11, trazabilidad por código QR de cada activo, auditoría de cambios y escáner QR para consulta rápida de bienes desde dispositivos móviles.</p>
      <p>Dirección: Pilar, Paraguay. Contacto: patrimonio@unp.edu.py</p>
      <p><a href="https://sistema-patrimonial.unp.edu.py/">Ir a la Plataforma Principal</a></p>
